
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | DSA Visualizer</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .reset-container {
            width: min(420px, 90%);
            margin: 70px auto;
            padding: 30px;
            border: 1px solid #eab308;
            border-radius: 12px;
            text-align: center;
        }

        .reset-container h1 {
            margin-bottom: 12px;
        }

        .reset-container p {
            margin-bottom: 22px;
        }

        .reset-container input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #eab308;
            border-radius: 6px;
        }

        .reset-container button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #eab308;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }

        #resetMessage {
            margin-top: 16px;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="reset-container">
        <h1>Reset Password</h1>

        <p>Enter your registered email address. We'll send you a password reset link.</p>

        <form id="resetForm">
            <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                required
            >

            <button type="submit" id="resetButton">
                Send Reset Link
            </button>
        </form>

        <p id="resetMessage" role="status"></p>

        <a class="back-link" href="login.html">Back to Login</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>
        const resetForm = document.getElementById("resetForm");
        const resetButton = document.getElementById("resetButton");
        const resetMessage = document.getElementById("resetMessage");

        resetForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();

            resetButton.disabled = true;
            resetButton.textContent = "Sending...";
            resetMessage.textContent = "";

            try {
                const { error } =
                    await window.supabaseClient.auth.resetPasswordForEmail(
                        email,
                        {
                            redirectTo:
                                window.location.origin +
                                window.location.pathname.replace(
                                    /[^/]*$/,
                                    ""
                                ) +
                                "update-password.html"
                        }
                    );

                if (error) {
                    throw error;
                }

                resetMessage.textContent =
                    "If an account exists for this email, a reset link will be sent. Check your inbox.";
            } catch (error) {
                resetMessage.textContent =
                    error.message || "Unable to send the reset link. Please try again.";
            } finally {
                resetButton.disabled = false;
                resetButton.textContent = "Send Reset Link";
            }
        });
    </script>
</body>
</html>
