
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose New Password | DSA Visualizer</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .reset-container {
            width: min(420px, 90%);
            margin: 70px auto;
            padding: 30px;
            border: 1px solid #eab308;
            border-radius: 12px;
            text-align: center;
        }

        .reset-container h1 {
            margin-bottom: 12px;
        }

        .reset-container p {
            margin-bottom: 20px;
        }

        .reset-container input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #eab308;
            border-radius: 6px;
        }

        .reset-container button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #eab308;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-container button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #updateMessage {
            margin-top: 16px;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="reset-container">
        <h1>Choose New Password</h1>
        <p>Enter your new password below.</p>

        <form id="updateForm">
            <input
                type="password"
                id="newPassword"
                placeholder="New password"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="6"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="updateButton">
                Update Password
            </button>
        </form>

        <p id="updateMessage" role="status"></p>
        <a class="back-link" href="login.html">Back to Login</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>
        const updateForm = document.getElementById("updateForm");
        const updateButton = document.getElementById("updateButton");
        const updateMessage = document.getElementById("updateMessage");

        let recoveryReady = false;

        window.supabaseClient.auth.onAuthStateChange(
            (event, session) => {
                if (event === "PASSWORD_RECOVERY" && session) {
                    recoveryReady = true;
                    updateMessage.textContent =
                        "Reset link verified. You can choose a new password.";
                }
            }
        );

        updateForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const password =
                document.getElementById("newPassword").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password.length < 6) {
                updateMessage.textContent =
                    "Password must contain at least 6 characters.";
                return;
            }

            if (password !== confirmPassword) {
                updateMessage.textContent =
                    "Passwords do not match.";
                return;
            }

            updateButton.disabled = true;
            updateButton.textContent = "Updating...";

            try {
                const { data: sessionData, error: sessionError } =
                    await window.supabaseClient.auth.getSession();

                if (sessionError || !sessionData.session) {
                    throw new Error(
                        "Your reset link is invalid or expired. Please request a new one."
                    );
                }

                const { error } =
                    await window.supabaseClient.auth.updateUser({
                        password: password
                    });

                if (error) {
                    throw error;
                }

                updateMessage.textContent =
                    "Password updated successfully! You can now log in with your new password.";

                updateForm.reset();

                await window.supabaseClient.auth.signOut();
            } catch (error) {
                updateMessage.textContent =
                    error.message || "Unable to update your password.";
            } finally {
                updateButton.disabled = false;
                updateButton.textContent = "Update Password";
            }
        });
    </script>
</body>
</html>
